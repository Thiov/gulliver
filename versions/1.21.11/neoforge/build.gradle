plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = "${project.mod_version}+neoforge-${project.minecraft_version}"
group = 'gulliver'

base {
    archivesName = 'gulliver'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: '../../../gradle/gulliver.gradle'

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (project.hasProperty('selftest')) programArguments.addAll('--quickPlaySingleplayer', 'selftest')
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            if (project.hasProperty('selftest')) systemProperty 'gulliver.selftest', 'true'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        gulliver {
            sourceSet(sourceSets.main)
        }
    }
}
